<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Estrutura.css">
    <script src="chart.js"></script>

    <!--biblioteca de graficos para colocar o historico de vendas-->
</head>
<body>
    <header>
       <div id="superior">
<h1 class = 'cima'>Menu</h1>
      
</div> 
    
    </header>

<main id="centro">
  
    



<!-- toda a tabela -->
   <div id="tabela">
    <div class="topo-tabela">
   <div> <button id="adicionarCelula" class="material-icons">add</button></div>


</div>
<!-- botão para adicionar celular na tabela -->

   <table >
  <thead>

    <tr>
      <th class="tabela-cima">Produto</th>
      <th class="tabela-cima">quant</th>
      <th class="tabela-cima">prec unit</th>
      <th class="tabela-cima">valor em estoque</th>
      <th class="tabela-cima">valor gasto</th>
    </tr>
  </thead>

  <!--class de alinhamento a direita para dinheiro-->
  
  <tbody id="corpo-tabela">
    

  </tbody>

  <tfooter>
    <tr>
      
   <th id="total-estoque" class="tabela-baixo" colspan="3" >total em estoque:<br> <span id="soma-estoque">R$ 0,00 </span></th>

   <th id="total-gasto" class="tabela-baixo" colspan="2">total gasto: <br> <span id="soma-gasto"> R$ 0,00 </span> </th>

    </tr>

    

  </tfooter>
  
</table>
  
</div>

<!-- lado do grafico -->

   <div id="painel-direito">
   <div class="filtros-grafico">

    <button>
    dia
 </button>
 <button>
    mês
 </button>
 <button class="ativo">
    ano
 </button>

    </div>
    <div id="grafico" >
    <canvas id="meuGrafico"></canvas>

  </div>

   </div>

</main>

<footer>
<div>
<p id="autor"></p>
</div>
</footer>


 <!-- Janela Flutuante para Cadastrar/Editar -->

<div id="modalProduto" class="modal">
  <div class="modal-conteudo">
    <span class="fechar-modal">&times;</span>
    <h3 id="modalTitulo">Adicionar Novo Produto</h3>
    
    <form id="formProduto">
      <!-- Campo oculto para saber se estar editando ou adicionando -->
      <input type="hidden" id="produtoId">
      
      <label>Nome do Produto:</label>
      <input type="text" id="nomeProd" required>
      
      <label>Quantidade:</label>
      <input type="number" id="quantProd" required>
      
      <label>Preço Unitário (R$):</label>
      <input type="number" step="0.01" id="precoProd" required>
      
      
      <label>Valor Gasto (R$):</label>
      <input type="number" step="0.01" id="gastoProd" required>
      
      <button type="submit" id="btnSalvar">Salvar</button>
    </form>
  </div>
</div>

<!-- Janela Flutuante para Escolher a Quantidade da Venda -->

<div id="modalVenda" class="modal">
  <div class="modal-conteudo">
    <span class="fechar-modal-venda" style="position: absolute; right: 15px; top: 10px; font-size: 24px; cursor: pointer;">&times;</span>
    <h3>Registrar Venda</h3>
    <p id="vendaNomeProduto" style="font-weight: bold; color: #4ea8de;"></p>
    
    <form id="formVenda">
      <label>Quantidade a vender:</label>
      <input type="number" id="vendaQuant" min="1" required>
      <small id="vendaMaxAviso" style="color: #666; display: block; margin-bottom: 15px;"></small>
      
      <button type="submit" style="width: 100%; padding: 10px; background-color: #70e000; color: white; border: none; border-radius: 4px; cursor: pointer;">Confirmar Venda</button>
    </form>
  </div>
</div>

<script src="./Logica.js"></script>

</body>
</html>
